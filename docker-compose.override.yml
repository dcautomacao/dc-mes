services:         
  postgres:
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data

  nodered:
    volumes:
      - ./flow:/data

  frontend:
    image: node:20-alpine
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
    command:
      sh -c "npm install && npm run dev"
